    type: cloze
    context: "SQL"
    source: s1
    text: "O WHERE {{c1::filtra as linhas antes de qualquer agrupamento acontecer}}."
  - id: resposta-longa
    context: "Redes"
    source: s1
    front: "Por que o TCP usa handshake de três vias?"
    back: "Porque cada lado precisa anunciar seu número de sequência inicial e confirmar o do outro lado, o que exige pelo menos três segmentos trocados entre cliente e servidor antes dos dados."
  - id: exemplo-citado
    context: "BD"
    source: s1
    front: "No diagrama, qual entidade é fraca?"
    back: "==Dependente=="
