notes:
  - id: lista
    context: "BD › ACID"
    source: s1
    front: "Quais são as propriedades ACID?"
    back: |
      - Atomicidade
      - Consistência
      - Isolamento
      - Durabilidade
  - id: binaria
    context: "SQL"
    source: s1
    front: "É possível usar HAVING sem GROUP BY?"
    back: "==Sim==, o grupo é a tabela inteira."
  - id: vazamento
    context: "SQL"
    source: s1
    front: "A cláusula HAVING filtra grupos. Que cláusula filtra grupos?"
    back: "==HAVING=="
  - id: sql-sem-esquema
    context: "SQL"
    source: s1
    front: |
      Qual o resultado?

      ```sql
      SELECT nome FROM aluno WHERE curso_id = 2;
      ```
    back: "==Bia=="
  - id: provincial
    context: "SQL"
    source: s1
    front: "Segundo o slide 12, qual índice suporta busca por intervalo?"
    back: "==B-tree=="
  - id: pronome
    source: s1
    front: "Isso roda antes ou depois do GROUP BY?"
    back: "==Antes=="
  - id: termo
    context: "BD"
    source: s1
    front: "Qual restrição garante que a foreign key aponte para uma linha existente?"
    back: "==Integridade referencial=="
